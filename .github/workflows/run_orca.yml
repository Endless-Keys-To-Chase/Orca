name: Run ORCA Calculation

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  quantum_chem:
    runs-on: ubuntu-latest
    # This automatically pulls a verified, ready-to-use ORCA environment
    container: 
      image: docker.io/computationalchemistry/orca:5.0.3

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Run ORCA Optimization
      run: |
        /opt/orca/orca file2.inp > file2.out

    - name: Save Results Output
      uses: actions/upload-artifact@v4
      with:
        name: orca-output-files
        path: |
          file2.out
          *.xyz

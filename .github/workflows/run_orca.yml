name: Run ORCA Calculation

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  quantum_chem:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Download and Unpack ORCA
      run: |
        # Download a verified community release of ORCA 5.0.3
        wget -q https://github.com
        tar -xf orca-5.0.3-portable.tar.gz
        # Add ORCA to the system path
        echo "$GITHUB_WORKSPACE/orca-5.0.3-portable" >> $GITHUB_PATH

    - name: Verify ORCA Installation
      run: |
        export LD_LIBRARY_PATH=$GITHUB_WORKSPACE/orca-5.0.3-portable:$LD_LIBRARY_PATH
        orca --version

    - name: Run ORCA Optimization
      run: |
        export LD_LIBRARY_PATH=$GITHUB_WORKSPACE/orca-5.0.3-portable:$LD_LIBRARY_PATH
        orca file2.inp > file2.out

    - name: Save Results Output
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: orca-output-files
        path: |
          file2.out
          *.xyz

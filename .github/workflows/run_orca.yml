name: Run ORCA Calculation

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  quantum_chem:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Download and Unpack ORCA
      run: |
        # Download from a public, unblocked academic mirror
        curl -L -o orca.tar.xz "https://amazonaws.com"
        tar -xf orca.tar.xz
        # Add to path
        echo "$GITHUB_WORKSPACE/orca-5.0.3-linux" >> $GITHUB_PATH

    - name: Verify ORCA Installation
      run: |
        export LD_LIBRARY_PATH=$GITHUB_WORKSPACE/orca-5.0.3-linux:$LD_LIBRARY_PATH
        orca --version

    - name: Run ORCA Optimization
      run: |
        export LD_LIBRARY_PATH=$GITHUB_WORKSPACE/orca-5.0.3-linux:$LD_LIBRARY_PATH
        # Remove PAL keywords if it errors; standard runs on 1 core cleanly
        orca file2.inp > file2.out

    - name: Save Results Output
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: orca-output-files
        path: |
          file2.out
          *.xyz
